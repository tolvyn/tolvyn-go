# A GitHub release for each v* tag: the module source as a zip, SHA256SUMS, and a keyless cosign signature of the sums
# (Sigstore, from this workflow's OIDC identity). The module's integrity for `go get` stays sum.golang.org's; this is
# the release's provenance. The release job waits for a maintainer's approval in the `release` environment. Each action
# is pinned to a full commit SHA, the release tag it is resolved from in the comment beside it; until it is resolved it
# reads a placeholder, and a run fails at its first step.
name: release
on:
  push:
    tags: ['v*']
permissions: {}
# One run per tag at a time. Another run for the same tag waits instead of cancelling this one: a release is
# never cancelled halfway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    permissions:
      contents: read # to check out the tagged source
    steps:
      - uses: actions/checkout@PIN_ME # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@PIN_ME # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: The tag is the module's Version
        run: test "v$(sed -n 's/^const Version = "\(.*\)"$/\1/p' tolvyn.go)" = "$GITHUB_REF_NAME"
      - run: go vet ./...
      - run: go test ./...
  release:
    name: Release
    needs: test
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write # to check out the source, and create the GitHub release with its files
      id-token: write # for cosign's keyless signature (Sigstore, from this workflow's OIDC identity)
    steps:
      - uses: actions/checkout@PIN_ME # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@PIN_ME # v4.1.4
      - name: Source zip, sums and signature
        run: |
          git archive --format=zip --prefix="tolvyn-go-${GITHUB_REF_NAME}/" -o "tolvyn-go-${GITHUB_REF_NAME}.zip" "$GITHUB_REF_NAME"
          sha256sum "tolvyn-go-${GITHUB_REF_NAME}.zip" > SHA256SUMS
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
          # cosign v3 (cosign-installer v4) writes Sigstore's new bundle format; check that it did, and that the bundle
          # verifies with the identity install.sh and the README give customers, before anything is published.
          grep -q 'application/vnd.dev.sigstore.bundle' SHA256SUMS.sigstore.json
          cosign verify-blob SHA256SUMS --bundle SHA256SUMS.sigstore.json \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md." \
            "tolvyn-go-${GITHUB_REF_NAME}.zip" SHA256SUMS SHA256SUMS.sigstore.json
